name = "baker_harman_analytics"
version = "0.1.0"
defaultTargets = ["BakerHarmanAnalytics"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "BakerHarmanAnalytics"
roots = ["BakerHarmanAnalytics.SecondDerivativeTest", "BakerHarmanAnalytics.CorrelationPhase", "BakerHarmanAnalytics.ReciprocalPhaseRegularity", "BakerHarmanAnalytics.LatticeHyperplaneBasis"]
globs = ["BakerHarmanAnalytics.+"]
