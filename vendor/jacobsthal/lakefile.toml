name = "jacobsthal"
version = "0.1.0"
defaultTargets = ["Jacobsthal"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "Jacobsthal"
roots = ["OAI.NumberTheory.Jacobsthal.Conclusions.QuadraticBound"]
globs = ["OAI.+", "PrimeNumberTheoremAnd.+", "StrongPNT.+", "AbsorptionCutoff.+"]
